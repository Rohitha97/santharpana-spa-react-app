<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" href="/images/optimized/logo-png.webp" />
  <meta name="theme-color" content="#4b1e3d" />

  <!--
    Everything between the seo markers is REPLACED per route by
    scripts/prerender.mjs, using the metadata in src/config/seo.ts. The values
    below are the homepage's, and are what the dev server shows.

    Do not hand-edit titles or descriptions here — edit src/config/seo.ts, or
    the built pages and this file will disagree.
  -->
  <!--seo:start-->
  <title>Santharpana Ayurveda Ashram | Ayurveda &amp; Massage in Sigiriya</title>
  <meta name="description"
    content="Government-registered Ayurvedic spa in Sigiriya. Traditional full body massage, Shirodhara, Pinda Sweda and herbal steam bath. Open daily 9am–10pm. Book on WhatsApp." />
  <link rel="canonical" href="https://www.santharpanaspa.com/" />

  <!-- The hero background is the homepage's LCP element, so it is fetched
       immediately. Only .banner uses it, so the prerenderer emits this on the
       homepage alone — on inner pages it was downloading 51 KB nothing displays. -->
  <link rel="preload" as="image" href="/images/optimized/bg/slider-bg-1-jpg.webp" fetchpriority="high" />
  <!--seo:end-->

  <!--
    Fonts are linked here rather than @import-ed from index.css: an @import forces
    the browser to download the CSS bundle first before it even discovers the font
    request, adding a full round trip to first paint.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap" />
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.tsx"></script>

  <!--
    Analytics loads after the page is interactive so it never competes with the
    hero image or the app bundle for bandwidth during first paint.

    GA4_ID is empty until a GA4 property exists. The Ads tag alone records
    conversions but cannot tell you how many people reached the site or which
    pages they read, so create a GA4 property (analytics.google.com → Admin →
    Create property), paste the G-XXXXXXX id below, and link it to the Ads
    account. src/utils/analytics.ts already sends the button events.
  -->
  <script>
    window.SANTHARPANA_ADS_ID = 'AW-16700832834';
    window.SANTHARPANA_GA4_ID = '';

    window.addEventListener('load', function () {
      var primary = window.SANTHARPANA_GA4_ID || window.SANTHARPANA_ADS_ID;

      var s = document.createElement('script');
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + primary;
      s.async = true;
      document.head.appendChild(s);

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', window.SANTHARPANA_ADS_ID);
      if (window.SANTHARPANA_GA4_ID) gtag('config', window.SANTHARPANA_GA4_ID);
    });
  </script>
</body>

</html>
